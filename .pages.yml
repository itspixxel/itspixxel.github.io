  - name: home
    label: Homepage
    type: file
    path: src/content/settings/home.json
    format: json
    fields:
      - name: eyebrow
        label: Eyebrow
        type: string
      - name: headline
        label: Headline
        type: string
      - name: emphasis
        label: Emphasis
        type: string
      - name: intro
        label: Intro
        type: text
      - name: cta
        label: Cta
        type: string
      - name: sideNote
        label: Side Note
        type: string
      - name: interestTitle
        label: Interest Title
        type: string
      - name: interestText
        label: Interest Text
        type: text
      - name: interests
        label: Interests
        type: string
        list: true
      - name: showProjects
        label: Show Projects
        type: boolean
      - name: showWriting
        label: Show Writing
        type: boolean
      - name: showInterests
        label: Show Interests
        type: boolean
      - name: portrait
        label: Hero portrait
        type: image
      - name: portraitAlt
        label: Portrait description
        type: string
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - order
        - featured
        - draft
      sort: order
      order: asc
    fields:
      - &a1
        name: title
        label: Title
        type: string
        required: true
      - &a2
        name: description
        label: Description
        type: text
        required: true
      - &a3
        name: image
        label: Image
        type: image
      - &a4
        name: draft
        label: Draft
        type: boolean
        default: true
        description: Keep enabled while writing. Turn off and save to publish on the next successful deployment.
      - &a5
        name: featured
        label: Featured
        type: boolean
        description: Highlight this entry in featured listings.
      - &a6
        name: sample
        label: Sample
        type: boolean
      - &a7
        name: tags
        label: Tags
        type: string
        list: true
      - name: imageAlt
        label: Image Alt
        type: string
      - name: order
        label: Order
        type: number
        default: 100
        description: Lower numbers appear first. The homepage shows the first three featured projects.
      - name: status
        label: Status
        type: string
      - name: engine
        label: Engine
        type: string
      - name: role
        label: Role
        type: string
      - name: duration
        label: Project duration
        type: string
      - name: team
        label: Team size and context
        type: string
      - name: year
        label: Year
        type: string
      - name: note
        label: Note
        type: text
      - name: video
        label: Video
        type: string
        description: YouTube embed URL, for example https://www.youtube.com/embed/VIDEO_ID. Appears as the project film.
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: Url
            type: string
      - name: gallery
        label: Gallery
        type: object
        list: true
        fields:
          - name: src
            label: Src
            type: image
          - name: alt
            label: Alt
            type: string
      - name: showCarousel
        label: Show media carousel
        type: boolean
        default: true
        description: Turn off to show the trailer on its own. Gallery images are kept for later.
      - name: sections
        label: Case study sections
        type: object
        list: true
        description: Sections appear after Body, with images alternating sides on desktop.
        fields:
          - name: title
            label: Heading
            type: string
            required: true
          - name: text
            label: Explanation
            type: text
            description: Separate paragraphs with a blank line.
          - name: image
            label: Image
            type: image
          - name: imageAlt
            label: Image description
            type: string
          - name: caption
            label: Image caption
            type: text
      - &a8
        name: body
        label: Body
        type: rich-text
        description: Write with the visual editor and insert uploaded images. Switch to Source for Markdown code blocks and tables.
        options:
          format: markdown
          switcher: true
  - name: blog
    label: Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - date
        - draft
        - featured
      sort: date
      order: desc
    fields:
      - *a1
      - *a2
      - *a3
      - *a4
      - *a5
      - *a6
      - *a7
      - name: date
        label: Date
        type: date
        required: true
      - name: updated
        label: Updated
        type: date
      - *a8
  - name: about
    label: About
    type: file
    path: src/content/pages/about.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: image
        label: Image
        type: image
      - name: profileName
        label: Profile name
        type: string
      - name: profileDetail
        label: Name and pronouns
        type: string
      - name: profileBio
        label: Bio under portrait
        type: text
      - name: originStory
        label: How I got here (expandable story)
        type: text
        description: Hidden behind a disclosure on About. Separate paragraphs with a blank line.
      - *a8
  - name: now
    label: Now
    type: file
    path: src/content/pages/now.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: updated
        label: Updated
        type: date
      - name: currentWork
        label: Current work card
        type: object
        fields:
          - name: label
            label: label
            type: string
          - name: title
            label: title
            type: string
          - name: platform
            label: platform
            type: string
          - name: studio
            label: studio
            type: string
          - name: description
            label: description
            type: text
          - name: url
            label: url
            type: string
          - name: linkLabel
            label: link Label
            type: string
          - name: image
            label: Cover image
            type: image
          - name: imageAlt
            label: Cover description
            type: string
          - name: trailer
            label: Trailer video
            type: file
          - name: playLabel
            label: Play button label
            type: string
          - name: pauseLabel
            label: Pause button label
            type: string
      - *a8
  - name: play
