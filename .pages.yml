media:
  input: public/media
  output: /media
content:
  - name: site
    label: Site settings, navigation & contact
    type: file
    path: src/content/settings/site.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: text
      - name: status
        label: Status
        type: string
      - name: footer
        label: Footer
        type: string
      - name: contactTitle
        label: Contact Title
        type: string
      - name: contactText
        label: Contact Text
        type: text
      - name: email
        label: Email
        type: string
      - name: showEmail
        label: Show Email
        type: boolean
      - name: socials
        label: Socials
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: Url
            type: string
          - name: visible
            label: Visible
            type: boolean
      - name: navigation
