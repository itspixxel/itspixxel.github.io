      - name: rigDescription
        label: rig Description
        type: text
      - name: targetLabel
        label: target Label
        type: text
      - name: inspectLabel
        label: inspect Label
        type: text
      - name: commentaryLabel
        label: commentary Label
        type: text
      - name: commentaryOff
        label: commentary Off
        type: text
      - name: commentaryHeading
        label: commentary Heading
        type: text
      - name: roomLabel
        label: room Label
