          - name: rss
            label: Rss
            type: string
          - name: edit
            label: Edit
            type: string
          - name: notFound
            label: Not Found
            type: string
          - name: notFoundText
            label: Not Found Text
            type: text
          - name: loadMore
            label: Load More
            type: string
          - name: updated
            label: Updated
            type: string
          - name: share
            label: Share
            type: string
          - name: projectsTitle
            label: Projects Title
            type: string
          - name: projectsIntro
            label: Projects Intro
            type: text
          - name: blogTitle
            label: Blog Title
            type: string
          - name: blogIntro
            label: Blog Intro
            type: text
          - name: interests
            label: Interests
            type: string
          - name: aboutLink
            label: About Link
            type: string
          - name: next
            label: Next
