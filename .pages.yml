            type: text
          - name: allWork
            label: All Work
            type: string
          - name: allWriting
            label: All Writing
            type: string
          - name: read
            label: Read
            type: string
          - name: back
            label: Back
            type: string
          - name: search
            label: Search
            type: string
          - name: all
            label: All
            type: string
          - name: empty
            label: Empty
            type: string
          - name: copy
            label: Copy
            type: string
          - name: copied
            label: Copied
            type: string
          - name: related
            label: Related
            type: string
          - name: toc
            label: Toc
            type: string
          - name: sample
            label: Sample
            type: string
          - name: archive
            label: Archive
            type: string
          - name: contact
            label: Contact
